
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Commerce Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">

            <div class="text-center mb-4">
                <div class="brand-icon">
                    <img src="image/ashton-lilo-logo.png" alt="Ashton&Lilo Logo">
                </div>

                <p class="text-muted">
                    E-Commerce Management System
                </p>
            </div>

            <h4 class="fw-bold mb-2 text-center">
                Welcome Back!
            </h4>

            <p class="text-muted mb-4 text-center">
                Please sign in to your administrator account.
            </p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="alert alert-danger d-none">
                    Invalid username or password.
                </div>

                <button type="submit" class="btn login-btn w-100">
                    Sign In
                </button>

            </form>

            <div class="text-center mt-4">
                <small class="text-muted">
                    © 2026 Ashton&Lilo. All Rights Reserved.
                    <p>username: admin | password: admin123</p>
                </small>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
